[project]
name = "rag-document-assistant"
version = "1.0.0"
description = "AI-powered document assistant: ask questions about your PDFs with page-level citations (RAG)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["slow: tests that load the real embedding model"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
